name: CI & Deploy

# One pipeline. A minimal gate protects the published page; we deploy as soon as it
# passes; the fuller verification runs afterward as NOTIFY-ONLY - a failure there reds
# the run but never undoes an already-published deploy.
#
#   gate --> deploy --> verify: full test suite
#                   \-> verify: native build (3-OS)
#
# On pull requests the deploy job is skipped, but the gate and both verify jobs still
# run, so a PR gets full coverage without publishing anything.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages: write Pages, and id-token for its OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push to the same ref wins. Keyed per ref so pull requests and master never
# cancel each other; the Pages singleton is handled separately on the deploy job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.7

jobs:
  # -- Gate -------------------------------------------------------------------
  # The minimum that must hold for the published page: everything is formatted, the
  # shipped crates lint, the geometry is correct, and the WASM bundle actually builds.
  # The bundle built here IS the artifact that gets deployed - it is never rebuilt.
  gate:
    name: Gate (lint - geometry tests - WASM build)
    runs-on: ubuntu-latest
    steps:
      # The whole history, because `tools/outbox` checks that every commit an outbox cites
      # exists. `actions/checkout` is shallow by default, and a shallow clone has exactly
      # one commit - so that check found forty-odd citations missing on 2026-09-02, all of
      # which exist. It skips a shallow clone now, correctly, which means the default
      # checkout would leave it running nowhere but the pre-push hook.
      #
      # 4.2 MiB across 444 commits, against a Rust toolchain, Trunk and a wasm release
      # build in the same job. The cost is not the reason to skip a check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A check that silently stops running looks exactly like a check that passes, which
      # is the failure this whole step exists because of. If the line above is ever lost,
      # the citation check goes quiet rather than red - so this goes red instead.
      - name: The checkout has history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "the gate's checkout is shallow, so the citation check will skip silently" >&2
            echo "restore 'fetch-depth: 0' on actions/checkout in this job" >&2
            exit 1
          fi
          echo "$(git rev-list --count HEAD) commits; the citation check can see them"

      # Clippy compiles the Bevy-facing crates natively, so this job needs Bevy's Linux
      # system libraries. The wasm32 Trunk build links none of them; installing here is
      # harmless either way.
      #
      # **`apt-get update` exits 100 if ANY index fails**, including third-party repositories
      # the runner image carries and this build never touches. On 2026-09-09 that reddened the
      # gate and blocked a deploy because `dl.google.com/linux/chrome-stable` served a
      # `Packages.gz` not matching its own `Release` file - while every Ubuntu index
      # downloaded fine, 9436 kB of them.
      #
      # **The subject of this step is whether four packages install**, so that is what is
      # allowed to fail it. Judging the input rather than the outcome is the shape `CLAUDE.md`
      # records four times; here it cost a deploy rather than a wrong answer. A genuinely
      # broken Ubuntu index still fails loudly, on the install, naming what it could not get.
      #
      # The same line is in the two verify jobs and changed with this one.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain (wasm32 + lint components)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /usr/local/bin
          trunk --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` or this lints no test code at all - `Q-82`, and `hooks/pre-push`
      # carries the argument. A hook the pipeline does not mirror is half a gate: the hook
      # can be skipped with `--no-verify` and this cannot.
      - name: Clippy (everything, tests included)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The rules and the geometry are where correctness lives: the whole first-release
      # command script runs here, and the geometry tests run with it.
      # The geometry part: the solid must close up, every polygon
      # must have one side per neighbour, and every Goldberg count must come out with
      # twelve pentagons. Release mode because the relaxation tests are slow otherwise.
      # Selected by exclusion, deliberately. A list of crates to *include* goes stale
      # silently every time a crate is added or split: planet-terrain was missing from it
      # when it landed, and splitting planet-bevy moved seven tests into planet-flat, which
      # nothing named - so they ran only in the verify job, after the page was already
      # published, and nothing failed to say so.
      #
      # Excluding makes coverage the default. The list is wrong only when somebody
      # deliberately removes a name, and it names one fact: does the crate link an engine.
      - name: Test (everything that does not link an engine, release)
        run: cargo test --release --workspace --exclude planet-ecs --exclude planet-bevy --exclude planet-flat --exclude game-globe --exclude game4x --exclude planet-view --exclude goldberg-view

      # Debug for the engine-facing ones: clippy above has just compiled them unoptimized,
      # so this reuses that build rather than paying for a release build of Bevy. They used
      # to run only in the verify job, which reports after the page is already published -
      # a strange place to keep a regression test for a bug that shipped once.
      # tools/ is outside the workspace, so --workspace does not reach it and these ran only
      # when somebody typed the path. One checks that every crate has a row in
      # docs/architecture.md, and while it was unwired the table went stale twice with
      # nothing to say so - C-12. A check nobody runs has no answer, and no answer looks
      # exactly like a right one.
      # Found rather than listed - `Q-46`. A name list goes stale the moment a fourth tool
      # exists, and one had: `tools/spec` was reached by nothing here or in the hook.
      - name: Test (the documentation tools)
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest"
            # tools/spec is the specification lane's own; it has a live warning this lane
            # may not fix. Q-46. The exclusion goes when they do.
            if [ "$manifest" != "tools/spec/Cargo.toml" ]; then
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            fi
          done

      - name: Test (the engine-facing crates)
        run: cargo test -p planet-ecs -p planet-bevy -p planet-flat -p game-globe -p game4x -p planet-view -p goldberg-view

      # Run from the crate directory: Trunk resolves the cargo manifest from its working
      # directory, and the workspace root is a virtual manifest with no root package.
      # --public-url makes asset URLs resolve under the project subpath at
      # https://seanshubin.github.io/game4x/.
      - name: Build (WASM, release)
        working-directory: crates/game4x
        run: trunk build --release --cargo-profile web-release --public-url /game4x/

      # Emit a wasm-independent build-info.json and fill the placeholder <meta> tags
      # Trunk copied into dist/index.html, so the served page always reveals which commit
      # is live even when the wasm fails to boot.
      - name: Write build provenance
        working-directory: crates/game4x
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > dist/build-info.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${SHORT}",
            "ref": "${GITHUB_REF_NAME}",
            "builtAt": "${NOW}",
            "runUrl": "${RUN_URL}"
          }
          JSON
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g; s|__BUILD_TIME__|${NOW}|g" dist/index.html
          echo "Wrote provenance for ${SHORT} @ ${NOW}"

            # **The reports go out with the game** - `S-80`. They serve at `/game4x/reports/`, and
      # the game keeps the root: `dist/` has no `reports` or `scenario` of its own.
      #
      # **`scenario/` goes too, and that is the detail the whole thing turns on.** Every link
      # in the reports is relative, so any subpath serves them - but two leave the directory,
      # `../scenario/commands/play.4x` and `../scenario/expected/play.4x`. They have to land
      # beside `reports/` rather than inside it, or those two 404 on the published page while
      # working perfectly in a clone. `tests/browsable.rs` asserts that those two are still
      # the only ones that point outward, so a third arriving fails the gate rather than the
      # page.
      #
      # **Copied as committed rather than regenerated, and the gate is what makes that safe.**
      # `the_committed_catalog_is_what_the_release_generates` and
      # `every_committed_dump_is_what_the_scenario_produces` have already run by here, and
      # both fail if a committed report differs from what the generator produces. So
      # regenerating would either write identical bytes or publish bytes no test has seen -
      # and this step runs after the tests, which is the wrong side of them to be generating
      # anything.
      #
      # **The markdown siblings go out too**, because the pages link to them: `catalog.html`
      # has `href="catalog.md"`. `R-9` asks that every reference be a link the reader can
      # follow, so dropping them for rendering badly would leave every page with a dead link.
      # `reports/index.html` links outward at four paths and every one of them is copied
      # here. Two kinds of copy, deliberately: `scenario/` goes whole because all of it is
      # canonical data, and the research lens's files go one at a time because `lenses/` is
      # a working directory - its outbox, its dated reports, its notes to itself - and none
      # of that belongs on the site. `X-16`.
      #
      # The link is the repository's own path in both cases, so the same href works in a
      # clone and here, and there is no second copy of anything to go stale.
      #
      # `tests/browsable.rs` reads this file and fails if a linked path is not named in it.
      # That check can see the name and not the copy, so every copy asserts its own result
      # below - `cp` of a moved file is loud, but a `cp -r` of a moved directory is not.
      - name: Copy the reports into the artifact
        run: |
          cp -r reports crates/game4x/dist/reports
          cp -r scenario crates/game4x/dist/scenario
          mkdir -p crates/game4x/dist/lenses/research crates/game4x/dist/tools/research/formulas
          cp lenses/research/formulas.html crates/game4x/dist/lenses/research/formulas.html
          cp tools/research/formulas/data.json crates/game4x/dist/tools/research/formulas/data.json
          cp tools/research/formulas/results.json crates/game4x/dist/tools/research/formulas/results.json
          test -f crates/game4x/dist/reports/index.html
          test -f crates/game4x/dist/scenario/expected/play.4x
          test -f crates/game4x/dist/lenses/research/formulas.html
          test -f crates/game4x/dist/tools/research/formulas/data.json
          test -f crates/game4x/dist/tools/research/formulas/results.json
          echo "Published $(find crates/game4x/dist/reports -type f | wc -l) report files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/game4x/dist


  # -- Deploy -----------------------------------------------------------------
  # Publishes the gate's artifact. Skipped on pull requests. Its own concurrency group
  # makes Pages deploys a repo-wide singleton - never two at once.
  deploy:
    name: Deploy to GitHub Pages
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # -- Verify (notify-only) ---------------------------------------------------
  # The remaining work, run AFTER deploy so the page ships as fast as the gate allows.
  # `always() && gate succeeded` lets these run even when `deploy` is skipped (pull
  # requests); a failure here does not undo the deploy, it only reds the run.
  full-tests:
    name: Verify - full test suite
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: full-tests

      - name: Test (whole workspace)
        run: cargo test --release --workspace

  native-build:
    name: Verify - native build (${{ matrix.os }})
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: native

      - name: Build the application and the prototype
        run: cargo build --release -p game4x -p planet-view
