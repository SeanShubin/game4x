name: CI & Deploy

# One pipeline. A minimal gate protects the published page; we deploy as soon as it
# passes; the fuller verification runs afterward as NOTIFY-ONLY - a failure there reds
# the run but never undoes an already-published deploy.
#
#   gate --> deploy --> verify: full test suite
#                   \-> verify: native build (3-OS)
#
# On pull requests the deploy job is skipped, but the gate and both verify jobs still
# run, so a PR gets full coverage without publishing anything.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages: write Pages, and id-token for its OIDC.
permissions:
  contents: read
  pages: write
  id-token: write
  # **Reading this repository's artifacts**, which is how `deploy` carries the newest bundle when
  # the gate did not build one - `P-615`.
  actions: read

# A newer push to the same ref wins. Keyed per ref so pull requests and master never
# cancel each other; the Pages singleton is handled separately on the deploy job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.7

jobs:
  # -- Changes ----------------------------------------------------------------
  # Whether this push touched the app, or only what he reads.
  #
  # **`P-615`**: *approving a test does not deploy the app, and a push touching only what I review
  # does not run the app's gate.* **A path filter on `on:` cannot say that**, because it skips the
  # whole workflow and the deploy with it - and the same paragraph wants the page published in
  # seconds. So the question is asked here and `gate` is gated on the answer.
  #
  # **What he reads is listed rather than what the app is.** A new crate is app code without
  # anybody remembering to add it; a new directory of reports is not, and there are five of them.
  # **The default is that it is the app**, which is the safe direction: an unlisted path runs the
  # gate rather than skipping it.
  changes:
    name: What this push touched
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.ask.outputs.code }}
      tests: ${{ steps.ask.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ask whether anything but the review surface changed
        id: ask
        run: |
          # **`before` is absent on the first push of a branch and on a dispatch**, and then the
          # answer is yes - there is nothing to compare against, so the gate runs.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "no comparable parent, so everything runs"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "$changed" | sed 's/^/  /'
          # **Four outcomes, because he named four** - `P-619`: *a push that touched code gets the
          # long build and the deploy. A push that touched the tests gets the short one. A push
          # that touched both gets the short one and then the long one. A push that touched
          # neither does nothing and tells me so.*
          #
          # **Measured over the last forty commits: 9 code, 4 tests, 3 both, 24 neither.** The
          # commonest case by a factor of two is the one that should do nothing, and today every
          # one of those twenty-four runs `Checks` and `Sweep` because neither has a condition.
          #
          # **`reports/` counts as the tests rather than as neither.** A commit that regenerates
          # reports without touching a test still has to publish, or the site goes stale while the
          # run says it did nothing. Three of the forty move bucket on that, and the specification
          # lane settled it in the item rather than leaving it to this script.
          tests=$(echo "$changed" | grep -E '^(reviewed/|spec/tests/|spec/|reports/|regression/|crates/game-model/data/foundation/tests/)' || true)
          # **Everything else that is not a document.** Notes, items and proposals are the bulk of
          # `neither`, and a document changing needs no build and no publish.
          papers=$(echo "$changed" | grep -E '^(docs/|lenses/|decide/|CLAUDE.md|README.md|temporary-notes/)' || true)
          rest=$(echo "$changed" | grep -vE '^(reviewed/|spec/tests/|spec/|reports/|regression/|crates/game-model/data/foundation/tests/|docs/|lenses/|decide/|CLAUDE.md|README.md|temporary-notes/)' || true)

          if [ -n "$rest" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "code changed:"
            echo "$rest" | sed 's/^/  /'
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$tests" ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "the review surface changed:"
            echo "$tests" | sed 's/^/  /'
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$rest" ] && [ -z "$tests" ]; then
            echo "neither: nothing here needs a build or a publish"
            echo "$papers" | sed 's/^/  /'
          fi

  # -- Gate -------------------------------------------------------------------
  # The minimum that must hold for the published page: everything is formatted, the
  # shipped crates lint, the geometry is correct, and the WASM bundle actually builds.
  # The bundle built here IS the artifact that gets deployed - it is never rebuilt.
  gate:
    name: Gate (lint - geometry tests - WASM build)
    # **Skipped when only the review surface changed** - `P-615`. `deploy` still runs and carries
    # the previous bundle, so the page appears without the game being rebuilt.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history, because `tools/outbox` checks that every commit an outbox cites
      # exists. `actions/checkout` is shallow by default, and a shallow clone has exactly
      # one commit - so that check found forty-odd citations missing on 2026-09-02, all of
      # which exist. It skips a shallow clone now, correctly, which means the default
      # checkout would leave it running nowhere but the pre-push hook.
      #
      # 4.2 MiB across 444 commits, against a Rust toolchain, Trunk and a wasm release
      # build in the same job. The cost is not the reason to skip a check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A check that silently stops running looks exactly like a check that passes, which
      # is the failure this whole step exists because of. If the line above is ever lost,
      # the citation check goes quiet rather than red - so this goes red instead.
      - name: The checkout has history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "the gate's checkout is shallow, so the citation check will skip silently" >&2
            echo "restore 'fetch-depth: 0' on actions/checkout in this job" >&2
            exit 1
          fi
          echo "$(git rev-list --count HEAD) commits; the citation check can see them"

      # Clippy compiles the Bevy-facing crates natively, so this job needs Bevy's Linux
      # system libraries. The wasm32 Trunk build links none of them; installing here is
      # harmless either way.
      #
      # **`apt-get update` exits 100 if ANY index fails**, including third-party repositories
      # the runner image carries and this build never touches. On 2026-09-09 that reddened the
      # gate and blocked a deploy because `dl.google.com/linux/chrome-stable` served a
      # `Packages.gz` not matching its own `Release` file - while every Ubuntu index
      # downloaded fine, 9436 kB of them.
      #
      # **The subject of this step is whether four packages install**, so that is what is
      # allowed to fail it. Judging the input rather than the outcome is the shape `CLAUDE.md`
      # records four times; here it cost a deploy rather than a wrong answer. A genuinely
      # broken Ubuntu index still fails loudly, on the install, naming what it could not get.
      #
      # The same line is in the two verify jobs and changed with this one.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain (wasm32 + lint components)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # **The version this run installed, said out loud** - `S-229`, and `C-189` is what it is
      # for. `docs/process.md` declines a pin: the policy is to stay current and let `@stable`
      # and a current machine be the same thing. **What that policy needs is a notice when they
      # stop being the same thing**, and on 2026-09-30 the notice was a lint firing - which
      # arrives late, by luck, and says nothing about why.
      #
      # **This run knows the version and said it nowhere.** A red after a green local gate now
      # has a number beside it: compare it with `rustc --version` on the machine that ran the
      # gate, and *the machine is behind* is a fact rather than an inference.
      #
      # **Not a check, deliberately.** Nothing here can know what the local toolchain is, so
      # asserting agreement is not available; printing is.
      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version
          echo "The gate on a developer machine runs whatever is installed there."
          echo "A red here after a green gate usually means that machine is behind - C-189."

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /usr/local/bin
          trunk --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` or this lints no test code at all - `Q-82`, and `hooks/pre-push`
      # carries the argument. A hook the pipeline does not mirror is half a gate: the hook
      # can be skipped with `--no-verify` and this cannot.
      - name: Clippy (everything, tests included)
        run: cargo clippy --workspace --all-targets -- -D warnings


      # Run from the crate directory: Trunk resolves the cargo manifest from its working
      # directory, and the workspace root is a virtual manifest with no root package.
      # --public-url makes asset URLs resolve under the project subpath at
      # https://seanshubin.github.io/game4x/.
      - name: Build (WASM, release)
        working-directory: crates/game4x
        run: trunk build --release --cargo-profile web-release --public-url /game4x/

      # Emit a wasm-independent build-info.json and fill the placeholder <meta> tags
      # Trunk copied into dist/index.html, so the served page always reveals which commit
      # is live even when the wasm fails to boot.
      - name: Write build provenance
        working-directory: crates/game4x
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > dist/build-info.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${SHORT}",
            "ref": "${GITHUB_REF_NAME}",
            "builtAt": "${NOW}",
            "runUrl": "${RUN_URL}"
          }
          JSON
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g; s|__BUILD_TIME__|${NOW}|g" dist/index.html
          echo "Wrote provenance for ${SHORT} @ ${NOW}"

      # **The bundle, as an ordinary artifact rather than the Pages one** - `P-615`. `deploy`
      # assembles the site now, because it must be able to publish when this job did not run at
      # all: a push touching only `spec/tests/` or `reviewed/` skips the gate, and the page still
      # has to appear.
      #
      # **So what goes up here is the game and nothing else.** The reports are committed and
      # `deploy` copies them in; this is the one part of the site that has to be built.
      #
      # **`success()` rather than `always()`, and that is the carry.** A build that failed uploads
      # nothing, so `deploy` finds the previous run's bundle and publishes **the last game that
      # built** beside the freshly committed reports. Sean, 2026-10-02: *I get what you mean about
      # the game being one cycle behind, which I am fine with.*
      #
      # **Which is better than what `P-613` settled for and does not contradict it.** That
      # paragraph refused *nothing published* and accepted a broken game; this publishes the last
      # working one.
      - name: Keep the bundle for the deploy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: crates/game4x/dist
          if-no-files-found: error
          retention-days: 90


  # -- Checks -----------------------------------------------------------------
  # The test suites, in parallel, and nothing depends on this job.
  #
  # **Sean, 2026-10-02**: *I want to make sure a test I have not reviewed does not fail the
  # build, and my ability to review it comes online as soon as possible. Once I have
  # reviewed it, it can fail the next build.*
  #
  # **Both halves of that need the tests out of the deploy path.** A reviewed test going red
  # *should* fail the build - that is the gate working - but while it sat in `gate`, a red
  # test also meant no page, and **the page is where he reads the tests waiting on him.** So
  # the one thing that tells him to look was withheld by the thing he was meant to look at.
  #
  # **The run still goes red**, because a failed job fails the run. Only the dependency went.
  #
  # **`fmt` and `clippy` are still in `gate`, and the sentence that stood here said they *block
  # the deploy*. They do not, and saying so was worse than wrong** - `X-43`, the research lens,
  # 2026-10-02. It was true when written and stopped being true the same day, when `P-613` made
  # `deploy` run `if: always()`: a lint failure then skipped the step that copies the reports in,
  # while the upload still ran, so **the deploy succeeded and published a site with no reports at
  # all.** Pages replaces the whole site, so `reports/review/index.html` 404ed rather than going
  # stale - and `E-4`'s 57 cards and 165 case rows went with it.
  #
  # **A blocked deploy would have left the last good site up. This published emptiness**, which is
  # the one outcome `P-613` names as useless: *a staging area that vanishes when it breaks is no
  # use to me.*
  #
  # **The fix is below, on the copy step**, which needs no build: it moves committed files. What
  # genuinely depends on the build is `Write build provenance`, which edits the game's own
  # `index.html`, so that one stays conditional and a skipped build leaves the game broken rather
  # than the site empty.
  #
  # **Same shape as `sweep` and the same reason.** No `needs:` here and none pointing at it;
  # a `needs:` on `deploy` would only let the deploy start late, and *not blocked or delayed*
  # rules that out.
  checks:
    name: Checks (every test suite)
    # **The condition `gate` already had** - `P-619`. This had none, so it ran on every push: of the
    # last forty commits **twenty-four touched neither code nor tests**, and every one of them paid
    # 1399 seconds here for nothing.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **The engine-facing crates link Bevy, so this job needs what `gate` needs - and it did
      # not.** This lane wrote the step when `S-251` split the tests out of `gate`, **copied its
      # name and not its package list**, and left two of the four behind:
      # `libwayland-dev` and `libxkbcommon-dev`.
      #
      # **So `wayland-sys`'s `build.rs` failed in `pkg-config`** - *Package wayland-client was not
      # found in the pkg-config search path* - and the job went red on three runs while
      # `Verify - full test suite`, which has all four, passed over the same commit in the same
      # run. **The difference was never the command.**
      #
      # **`every_job_that_links_bevy_installs_the_same_packages` is the carrier**, because the
      # failure was a list drifting from three other copies of itself and nothing compared them.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update             || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version

      # **Its own cache key**, because sharing `gate`'s would have two jobs writing one entry
      # in parallel.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: checks


      # The rules and the geometry are where correctness lives: the whole first-release
      # command script runs here, and the geometry tests run with it.
      # The geometry part: the solid must close up, every polygon
      # must have one side per neighbour, and every Goldberg count must come out with
      # twelve pentagons. Release mode because the relaxation tests are slow otherwise.
      # Selected by exclusion, deliberately. A list of crates to *include* goes stale
      # silently every time a crate is added or split: planet-terrain was missing from it
      # when it landed, and splitting planet-bevy moved seven tests into planet-flat, which
      # nothing named - so they ran only in the verify job, after the page was already
      # published, and nothing failed to say so.
      #
      # Excluding makes coverage the default. The list is wrong only when somebody
      # deliberately removes a name, and it names one fact: does the crate link an engine.
      - name: Test (everything that does not link an engine, release)
        run: cargo test --release --all-targets --workspace --exclude planet-ecs --exclude planet-bevy --exclude planet-flat --exclude game-globe --exclude game4x --exclude planet-view --exclude goldberg-view --exclude goldberg-move

      # Debug for the engine-facing ones: clippy above has just compiled them unoptimized,
      # so this reuses that build rather than paying for a release build of Bevy. They used
      # to run only in the verify job, which reports after the page is already published -
      # a strange place to keep a regression test for a bug that shipped once.
      # tools/ is outside the workspace, so --workspace does not reach it and these ran only
      # when somebody typed the path. One checks that every crate has a row in
      # docs/architecture.md, and while it was unwired the table went stale twice with
      # nothing to say so - C-12. A check nobody runs has no answer, and no answer looks
      # exactly like a right one.
      # Found rather than listed - `Q-46`. A name list goes stale the moment a fourth tool
      # exists, and one had: `tools/spec` was reached by nothing here or in the hook.
      - name: Test (the documentation tools)
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest"
            # tools/spec is the specification lane's own; it has a live warning this lane
            # may not fix. Q-46. The exclusion goes when they do.
            if [ "$manifest" != "tools/spec/Cargo.toml" ]; then
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            fi
          done

      - name: Test (the engine-facing crates)
        run: cargo test -p planet-ecs -p planet-bevy -p planet-flat -p game-globe -p game4x -p planet-view -p goldberg-view -p goldberg-move

  # -- Sweep ------------------------------------------------------------------
  # The mutation sweep: it deletes each row of the game's data and changes each value,
  # re-runs the suite, and reports which mutations nothing noticed.
  # `docs/architecture.md` rule 13 is what it is about - every row and every value in
  # the game's data is load-bearing.
  #
  # **Its own job, in parallel, and nothing depends on it.** Sean, 2026-10-01: *I am
  # considering having it run in parallel, and having it not block the deploy* - and,
  # asked whether it should still fail the build: *I am fine with failing the build as
  # long as the deploy is not blocked or delayed.*
  #
  # **So there is no `needs:` here and none anywhere pointing at this job.** A `needs:`
  # on `deploy` would only let the deploy start late, and *not blocked or delayed* rules
  # that out as surely as it rules out blocking. The workflow still goes red when this
  # job fails, because a failed job fails the run.
  #
  # **What makes that safe is that nothing the sweep asserts is about the artifact.**
  # All six of its assertions are about the sweep itself - its shape, its floor, and
  # which files it reached - and **not one of them fires because a mutation survived**:
  #
  #     mutation.rs:71    five shared files                   shape
  #     mutation.rs:72    tests > 0, "mutating proves nothing" floor
  #     mutation.rs:81    no file the sweep did not reach      coverage
  #     mutation.rs:85    three files are the foundation       shape
  #     mutation.rs:1068  more than 150 rows deleted           floor
  #     mutation.rs:1305  more than 300 values changed         floor
  #
  # **So a red sweep means *this check stopped checking***, which is worth a red mark on
  # the run and is not a reason to withhold a page. The survivors are written to
  # `reports/`, read by a person, and decided there.
  #
  # **It was a step inside `gate` until 2026-10-02**, which both blocked the deploy and
  # delayed it by the seventeen minutes the sweep takes.
  sweep:
    name: Sweep (every row deleted, every value changed)
    # **The same condition, and 3176 seconds of it** - `P-619`. The sweep is about the game's data,
    # so a push that touched no code has nothing for it to sweep.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the same reason `gate` takes it: `tools/outbox` checks that
      # every commit an outbox cites exists, and a shallow clone has one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No Bevy dependencies: `game-model` links no engine, which is why it is in the
      # gate's *everything that does not link an engine* step rather than beside
      # `planet-bevy`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version

      # **Its own cache key.** Sharing `gate`'s would have two jobs writing one entry in
      # parallel, which is the race the key exists to avoid.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: sweep

      # Release, because seventeen minutes is the release figure and the debug one is
      # worse. `--ignored` is what selects the two sweep tests; they carry `#[ignore]`
      # so that `hooks/pre-push` does not pay for them.
      - name: Test (the mutation sweep)
        run: cargo test --release -p game-model -- --ignored

      # **The reports the sweep rewrites, kept as an artifact rather than committed.**
      # A run that changes them says so here; nothing in CI pushes, and the copies in
      # `reports/` are whatever the last local run left.
      - name: Keep what the sweep found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-reports
          path: reports/
          if-no-files-found: error

  # -- Deploy -----------------------------------------------------------------
  # Publishes the gate's artifact. Skipped on pull requests. Its own concurrency group
  # makes Pages deploys a repo-wide singleton - never two at once.
  # -- Publish ----------------------------------------------------------------
  # The short one: the committed reports beside whatever game last built.
  #
  # **`P-619`**: *a push that touched the tests gets the short one.* It needs no `gate`, because
  # everything it publishes is committed and the game is carried from the newest bundle there is.
  # **Twenty-six seconds**, measured on run `37137539481`.
  #
  # **It runs whenever the tests changed, including when the code did too** - that is the *both*
  # case, where this publishes first and `republish` follows twelve minutes later. **Pages replacing
  # the whole site is what makes that work rather than being a problem**: the first publish is fresh
  # reports with yesterday's game, the second is fresh reports with today's.
  #
  # **Not on a code-only push.** There is nothing new for it to publish that `republish` will not
  # publish better, and a wasted Pages deployment is a wasted Pages deployment.
  publish:
    name: Publish (the reports, with the last game that built)
    needs: changes
    if: needs.changes.outputs.tests == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      # **Before the local action, because a local action lives in the repository** - `S-257`.
      # Without this the run cannot find `.github/actions/publish` and deploys nothing.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish
        with:
          artifact: site-fast
          outcome: not run for this publish

  # -- Republish --------------------------------------------------------------
  # The long one: the same site, with the game this run built.
  #
  # **`P-619`**: *a push that touched code gets the long build and the deploy.* So this waits for
  # `gate`, and on a push that touched both it is the second of two publishes.
  #
  # **`always()` rather than on success** - `P-613`: *the whole site publishes whether or not the
  # run succeeded.* A failed build uploads no bundle, so the newest is the previous one and this
  # publishes the last game that worked beside fresh reports.
  #
  # **A named artifact, because two publishes in one run would otherwise collide** on the default
  # name and the second would fail rather than replace the first.
  republish:
    name: Republish (the reports, with the game this run built)
    needs: [changes, gate]
    if: always() && needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      # **Before the local action** - `S-257`, the same as `publish` above.
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish
        with:
          artifact: site-full
          outcome: ${{ needs.gate.result }}

  # -- Nothing ----------------------------------------------------------------
  # The fourth outcome: this push needs no build and no publish, and says so.
  #
  # **`P-619`**: *a push that touched neither does nothing and tells me so - which is most of what
  # lands here, and none of it needs a build.* **Twenty-four of the last forty commits.**
  #
  # **What *tells me so* means is his to settle and is not settled.** A green run whose only job
  # says *nothing to build* is the cheap version and **is still something he has to open**, which is
  # the same as silence for a person who is not looking. The specification lane filed the question
  # rather than inventing an answer, and this job is the part that does not depend on it: the run
  # ends green, in seconds, having said what it decided.
  nothing:
    name: Nothing to build
    needs: changes
    if: needs.changes.outputs.code != 'true' && needs.changes.outputs.tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say that there was nothing to do
        run: |
          echo "This push touched neither code nor the review surface."
          echo "No build, no test suite, no sweep, no publish - and the site is unchanged."
          echo "See the changes job above for what it did touch."


  # -- Verify (notify-only) ---------------------------------------------------
  # The remaining work, run AFTER deploy so the page ships as fast as the gate allows.
  # `always() && gate succeeded` lets these run even when `deploy` is skipped (pull
  # requests); a failure here does not undo the deploy, it only reds the run.
  full-tests:
    name: Verify - full test suite
    needs: [gate, republish]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: full-tests

      - name: Test (whole workspace)
        run: cargo test --release --all-targets --workspace

  native-build:
    name: Verify - native build (${{ matrix.os }})
    needs: [gate, republish]
    if: always() && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: native

      - name: Build the application and the prototype
        run: cargo build --release -p game4x -p planet-view
