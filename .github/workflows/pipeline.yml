name: CI & Deploy

# One pipeline. A minimal gate protects the published page; we deploy as soon as it
# passes; the fuller verification runs afterward as NOTIFY-ONLY - a failure there reds
# the run but never undoes an already-published deploy.
#
#   gate --> deploy --> verify: full test suite
#                   \-> verify: native build (3-OS)
#
# On pull requests the deploy job is skipped, but the gate and both verify jobs still
# run, so a PR gets full coverage without publishing anything.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages: write Pages, and id-token for its OIDC.
permissions:
  contents: read
  pages: write
  id-token: write
  # **Reading this repository's artifacts**, which is how `deploy` carries the newest bundle when
  # the gate did not build one - `P-615`.
  actions: read

# A newer push to the same ref wins. Keyed per ref so pull requests and master never
# cancel each other; the Pages singleton is handled separately on the deploy job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.7

jobs:
  # -- Changes ----------------------------------------------------------------
  # Whether this push touched the app, or only what he reads.
  #
  # **`P-615`**: *approving a test does not deploy the app, and a push touching only what I review
  # does not run the app's gate.* **A path filter on `on:` cannot say that**, because it skips the
  # whole workflow and the deploy with it - and the same paragraph wants the page published in
  # seconds. So the question is asked here and `gate` is gated on the answer.
  #
  # **What he reads is listed rather than what the app is.** A new crate is app code without
  # anybody remembering to add it; a new directory of reports is not, and there are five of them.
  # **The default is that it is the app**, which is the safe direction: an unlisted path runs the
  # gate rather than skipping it.
  changes:
    name: What this push touched
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.ask.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ask whether anything but the review surface changed
        id: ask
        run: |
          # **`before` is absent on the first push of a branch and on a dispatch**, and then the
          # answer is yes - there is nothing to compare against, so the gate runs.
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "no comparable parent, so the gate runs"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "$changed" | sed 's/^/  /'
          # Everything he reads or approves, and the generated forms that follow from it.
          only=$(echo "$changed" | grep -vE '^(reviewed/|spec/tests/|spec/|reports/|regression/|docs/|crates/game-model/data/foundation/tests/|lenses/|decide/|CLAUDE.md|README.md)' || true)
          if [ -z "$only" ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "only the review surface changed, so the gate is skipped"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "app code changed:"
            echo "$only" | sed 's/^/  /'
          fi

  # -- Gate -------------------------------------------------------------------
  # The minimum that must hold for the published page: everything is formatted, the
  # shipped crates lint, the geometry is correct, and the WASM bundle actually builds.
  # The bundle built here IS the artifact that gets deployed - it is never rebuilt.
  gate:
    name: Gate (lint - geometry tests - WASM build)
    # **Skipped when only the review surface changed** - `P-615`. `deploy` still runs and carries
    # the previous bundle, so the page appears without the game being rebuilt.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      # The whole history, because `tools/outbox` checks that every commit an outbox cites
      # exists. `actions/checkout` is shallow by default, and a shallow clone has exactly
      # one commit - so that check found forty-odd citations missing on 2026-09-02, all of
      # which exist. It skips a shallow clone now, correctly, which means the default
      # checkout would leave it running nowhere but the pre-push hook.
      #
      # 4.2 MiB across 444 commits, against a Rust toolchain, Trunk and a wasm release
      # build in the same job. The cost is not the reason to skip a check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A check that silently stops running looks exactly like a check that passes, which
      # is the failure this whole step exists because of. If the line above is ever lost,
      # the citation check goes quiet rather than red - so this goes red instead.
      - name: The checkout has history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "the gate's checkout is shallow, so the citation check will skip silently" >&2
            echo "restore 'fetch-depth: 0' on actions/checkout in this job" >&2
            exit 1
          fi
          echo "$(git rev-list --count HEAD) commits; the citation check can see them"

      # Clippy compiles the Bevy-facing crates natively, so this job needs Bevy's Linux
      # system libraries. The wasm32 Trunk build links none of them; installing here is
      # harmless either way.
      #
      # **`apt-get update` exits 100 if ANY index fails**, including third-party repositories
      # the runner image carries and this build never touches. On 2026-09-09 that reddened the
      # gate and blocked a deploy because `dl.google.com/linux/chrome-stable` served a
      # `Packages.gz` not matching its own `Release` file - while every Ubuntu index
      # downloaded fine, 9436 kB of them.
      #
      # **The subject of this step is whether four packages install**, so that is what is
      # allowed to fail it. Judging the input rather than the outcome is the shape `CLAUDE.md`
      # records four times; here it cost a deploy rather than a wrong answer. A genuinely
      # broken Ubuntu index still fails loudly, on the install, naming what it could not get.
      #
      # The same line is in the two verify jobs and changed with this one.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain (wasm32 + lint components)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # **The version this run installed, said out loud** - `S-229`, and `C-189` is what it is
      # for. `docs/process.md` declines a pin: the policy is to stay current and let `@stable`
      # and a current machine be the same thing. **What that policy needs is a notice when they
      # stop being the same thing**, and on 2026-09-30 the notice was a lint firing - which
      # arrives late, by luck, and says nothing about why.
      #
      # **This run knows the version and said it nowhere.** A red after a green local gate now
      # has a number beside it: compare it with `rustc --version` on the machine that ran the
      # gate, and *the machine is behind* is a fact rather than an inference.
      #
      # **Not a check, deliberately.** Nothing here can know what the local toolchain is, so
      # asserting agreement is not available; printing is.
      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version
          echo "The gate on a developer machine runs whatever is installed there."
          echo "A red here after a green gate usually means that machine is behind - C-189."

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /usr/local/bin
          trunk --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--all-targets` or this lints no test code at all - `Q-82`, and `hooks/pre-push`
      # carries the argument. A hook the pipeline does not mirror is half a gate: the hook
      # can be skipped with `--no-verify` and this cannot.
      - name: Clippy (everything, tests included)
        run: cargo clippy --workspace --all-targets -- -D warnings


      # Run from the crate directory: Trunk resolves the cargo manifest from its working
      # directory, and the workspace root is a virtual manifest with no root package.
      # --public-url makes asset URLs resolve under the project subpath at
      # https://seanshubin.github.io/game4x/.
      - name: Build (WASM, release)
        working-directory: crates/game4x
        run: trunk build --release --cargo-profile web-release --public-url /game4x/

      # Emit a wasm-independent build-info.json and fill the placeholder <meta> tags
      # Trunk copied into dist/index.html, so the served page always reveals which commit
      # is live even when the wasm fails to boot.
      - name: Write build provenance
        working-directory: crates/game4x
        run: |
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > dist/build-info.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${SHORT}",
            "ref": "${GITHUB_REF_NAME}",
            "builtAt": "${NOW}",
            "runUrl": "${RUN_URL}"
          }
          JSON
          sed -i "s|__BUILD_COMMIT__|${SHORT}|g; s|__BUILD_TIME__|${NOW}|g" dist/index.html
          echo "Wrote provenance for ${SHORT} @ ${NOW}"

      # **The bundle, as an ordinary artifact rather than the Pages one** - `P-615`. `deploy`
      # assembles the site now, because it must be able to publish when this job did not run at
      # all: a push touching only `spec/tests/` or `reviewed/` skips the gate, and the page still
      # has to appear.
      #
      # **So what goes up here is the game and nothing else.** The reports are committed and
      # `deploy` copies them in; this is the one part of the site that has to be built.
      #
      # **`success()` rather than `always()`, and that is the carry.** A build that failed uploads
      # nothing, so `deploy` finds the previous run's bundle and publishes **the last game that
      # built** beside the freshly committed reports. Sean, 2026-10-02: *I get what you mean about
      # the game being one cycle behind, which I am fine with.*
      #
      # **Which is better than what `P-613` settled for and does not contradict it.** That
      # paragraph refused *nothing published* and accepted a broken game; this publishes the last
      # working one.
      - name: Keep the bundle for the deploy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: crates/game4x/dist
          if-no-files-found: error
          retention-days: 90


  # -- Checks -----------------------------------------------------------------
  # The test suites, in parallel, and nothing depends on this job.
  #
  # **Sean, 2026-10-02**: *I want to make sure a test I have not reviewed does not fail the
  # build, and my ability to review it comes online as soon as possible. Once I have
  # reviewed it, it can fail the next build.*
  #
  # **Both halves of that need the tests out of the deploy path.** A reviewed test going red
  # *should* fail the build - that is the gate working - but while it sat in `gate`, a red
  # test also meant no page, and **the page is where he reads the tests waiting on him.** So
  # the one thing that tells him to look was withheld by the thing he was meant to look at.
  #
  # **The run still goes red**, because a failed job fails the run. Only the dependency went.
  #
  # **`fmt` and `clippy` are still in `gate`, and the sentence that stood here said they *block
  # the deploy*. They do not, and saying so was worse than wrong** - `X-43`, the research lens,
  # 2026-10-02. It was true when written and stopped being true the same day, when `P-613` made
  # `deploy` run `if: always()`: a lint failure then skipped the step that copies the reports in,
  # while the upload still ran, so **the deploy succeeded and published a site with no reports at
  # all.** Pages replaces the whole site, so `reports/review/index.html` 404ed rather than going
  # stale - and `E-4`'s 57 cards and 165 case rows went with it.
  #
  # **A blocked deploy would have left the last good site up. This published emptiness**, which is
  # the one outcome `P-613` names as useless: *a staging area that vanishes when it breaks is no
  # use to me.*
  #
  # **The fix is below, on the copy step**, which needs no build: it moves committed files. What
  # genuinely depends on the build is `Write build provenance`, which edits the game's own
  # `index.html`, so that one stays conditional and a skipped build leaves the game broken rather
  # than the site empty.
  #
  # **Same shape as `sweep` and the same reason.** No `needs:` here and none pointing at it;
  # a `needs:` on `deploy` would only let the deploy start late, and *not blocked or delayed*
  # rules that out.
  checks:
    name: Checks (every test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The engine-facing crates link Bevy, so this job needs what `gate` needs.
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version

      # **Its own cache key**, because sharing `gate`'s would have two jobs writing one entry
      # in parallel.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: checks


      # The rules and the geometry are where correctness lives: the whole first-release
      # command script runs here, and the geometry tests run with it.
      # The geometry part: the solid must close up, every polygon
      # must have one side per neighbour, and every Goldberg count must come out with
      # twelve pentagons. Release mode because the relaxation tests are slow otherwise.
      # Selected by exclusion, deliberately. A list of crates to *include* goes stale
      # silently every time a crate is added or split: planet-terrain was missing from it
      # when it landed, and splitting planet-bevy moved seven tests into planet-flat, which
      # nothing named - so they ran only in the verify job, after the page was already
      # published, and nothing failed to say so.
      #
      # Excluding makes coverage the default. The list is wrong only when somebody
      # deliberately removes a name, and it names one fact: does the crate link an engine.
      - name: Test (everything that does not link an engine, release)
        run: cargo test --release --workspace --exclude planet-ecs --exclude planet-bevy --exclude planet-flat --exclude game-globe --exclude game4x --exclude planet-view --exclude goldberg-view --exclude goldberg-move

      # Debug for the engine-facing ones: clippy above has just compiled them unoptimized,
      # so this reuses that build rather than paying for a release build of Bevy. They used
      # to run only in the verify job, which reports after the page is already published -
      # a strange place to keep a regression test for a bug that shipped once.
      # tools/ is outside the workspace, so --workspace does not reach it and these ran only
      # when somebody typed the path. One checks that every crate has a row in
      # docs/architecture.md, and while it was unwired the table went stale twice with
      # nothing to say so - C-12. A check nobody runs has no answer, and no answer looks
      # exactly like a right one.
      # Found rather than listed - `Q-46`. A name list goes stale the moment a fourth tool
      # exists, and one had: `tools/spec` was reached by nothing here or in the hook.
      - name: Test (the documentation tools)
        run: |
          for manifest in tools/*/Cargo.toml; do
            echo "== $manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest"
            # tools/spec is the specification lane's own; it has a live warning this lane
            # may not fix. Q-46. The exclusion goes when they do.
            if [ "$manifest" != "tools/spec/Cargo.toml" ]; then
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            fi
          done

      - name: Test (the engine-facing crates)
        run: cargo test -p planet-ecs -p planet-bevy -p planet-flat -p game-globe -p game4x -p planet-view -p goldberg-view -p goldberg-move

  # -- Sweep ------------------------------------------------------------------
  # The mutation sweep: it deletes each row of the game's data and changes each value,
  # re-runs the suite, and reports which mutations nothing noticed.
  # `docs/architecture.md` rule 13 is what it is about - every row and every value in
  # the game's data is load-bearing.
  #
  # **Its own job, in parallel, and nothing depends on it.** Sean, 2026-10-01: *I am
  # considering having it run in parallel, and having it not block the deploy* - and,
  # asked whether it should still fail the build: *I am fine with failing the build as
  # long as the deploy is not blocked or delayed.*
  #
  # **So there is no `needs:` here and none anywhere pointing at this job.** A `needs:`
  # on `deploy` would only let the deploy start late, and *not blocked or delayed* rules
  # that out as surely as it rules out blocking. The workflow still goes red when this
  # job fails, because a failed job fails the run.
  #
  # **What makes that safe is that nothing the sweep asserts is about the artifact.**
  # All six of its assertions are about the sweep itself - its shape, its floor, and
  # which files it reached - and **not one of them fires because a mutation survived**:
  #
  #     mutation.rs:71    five shared files                   shape
  #     mutation.rs:72    tests > 0, "mutating proves nothing" floor
  #     mutation.rs:81    no file the sweep did not reach      coverage
  #     mutation.rs:85    three files are the foundation       shape
  #     mutation.rs:1068  more than 150 rows deleted           floor
  #     mutation.rs:1305  more than 300 values changed         floor
  #
  # **So a red sweep means *this check stopped checking***, which is worth a red mark on
  # the run and is not a reason to withhold a page. The survivors are written to
  # `reports/`, read by a person, and decided there.
  #
  # **It was a step inside `gate` until 2026-10-02**, which both blocked the deploy and
  # delayed it by the seventeen minutes the sweep takes.
  sweep:
    name: Sweep (every row deleted, every value changed)
    runs-on: ubuntu-latest
    steps:
      # The whole history, for the same reason `gate` takes it: `tools/outbox` checks that
      # every commit an outbox cites exists, and a shallow clone has one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No Bevy dependencies: `game-model` links no engine, which is why it is in the
      # gate's *everything that does not link an engine* step rather than beside
      # `planet-bevy`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Say which toolchain this run is holding
        run: |
          rustc --version
          cargo clippy --version

      # **Its own cache key.** Sharing `gate`'s would have two jobs writing one entry in
      # parallel, which is the race the key exists to avoid.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: sweep

      # Release, because seventeen minutes is the release figure and the debug one is
      # worse. `--ignored` is what selects the two sweep tests; they carry `#[ignore]`
      # so that `hooks/pre-push` does not pay for them.
      - name: Test (the mutation sweep)
        run: cargo test --release -p game-model -- --ignored

      # **The reports the sweep rewrites, kept as an artifact rather than committed.**
      # A run that changes them says so here; nothing in CI pushes, and the copies in
      # `reports/` are whatever the last local run left.
      - name: Keep what the sweep found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-reports
          path: reports/
          if-no-files-found: error

  # -- Deploy -----------------------------------------------------------------
  # Publishes the gate's artifact. Skipped on pull requests. Its own concurrency group
  # makes Pages deploys a repo-wide singleton - never two at once.
  # **Deploys whatever exists, whether or not the run succeeded** - `P-613`. It still waits for the
  # build job, because the artifact is what that job assembles and there is one Pages deployment to
  # put it in; what went is the requirement that the job *passed*.
  #
  # **`checks` and `sweep` are not waited for.** A red suite reds the run and does not delay the
  # page, which is `P-612`: *publishing it needs a checkout and nothing else.*
  deploy:
    name: Deploy to GitHub Pages
    needs: gate
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # **The newest bundle there is: this run's when the gate built one, the previous run's when
      # it did not** - `P-615`, and Sean: *I get what you mean about the game being one cycle
      # behind, which I am fine with.*
      #
      # **One mechanism rather than a branch.** The API lists artifacts newest first, so asking for
      # the newest `bundle` answers both cases without this job knowing which happened - the gate
      # skipped because only the review surface changed, or the gate ran and built one.
      #
      # **An expired or absent bundle is not fatal.** The reports are what he reads and they are
      # committed; a site with no game is worse than one with a stale game and better than no site
      # at all, which is `P-613`'s sentence. So this says so and carries on.
      - name: Take the newest bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p crates/game4x/dist
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=bundle&per_page=1" \
                 --jq '.artifacts[0] | select(.expired == false) | .id' 2>/dev/null || true)
          if [ -z "$id" ]; then
            echo "no bundle to carry - publishing the reports without the game"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > bundle.zip
          unzip -q -o bundle.zip -d crates/game4x/dist
          rm -f bundle.zip
          echo "carried bundle $id: $(find crates/game4x/dist -type f | wc -l) file(s)"
          test -f crates/game4x/dist/index.html || echo "the bundle has no index.html"


            # **The reports go out with the game** - `S-80`. They serve at `/game4x/reports/`, and
      # the game keeps the root: `dist/` has no `reports` or `scenario` of its own.
      #
      # **`scenario/` goes too, and that is the detail the whole thing turns on.** Every link
      # in the reports is relative, so any subpath serves them - but some leave the directory,
      # `../scenario/main.4x` and `../spec/data/` among them. They have to land beside
      # `reports/` rather than inside it, or those 404 on the published page while working
      # perfectly in a clone. `tests/browsable.rs` asserts that links reaching outward still
      # resolve, so one arriving that does not fails the gate rather than the page.
      #
      # **Copied as committed rather than regenerated, and the gate is what makes that safe.**
      # `the_committed_catalog_is_what_the_release_generates` and
      # `every_committed_dump_is_what_the_scenario_produces` have already run by here, and
      # both fail if a committed report differs from what the generator produces. So
      # regenerating would either write identical bytes or publish bytes no test has seen -
      # and this step runs after the tests, which is the wrong side of them to be generating
      # anything.
      #
      # **The markdown siblings go out too**, because the pages link to them: `catalog.html`
      # has `href="catalog.md"`. `R-9` asks that every reference be a link the reader can
      # follow, so dropping them for rendering badly would leave every page with a dead link.
      # `reports/index.html` links outward at four paths and every one of them is copied
      # here. Two kinds of copy, deliberately: `scenario/` goes whole because all of it is
      # canonical data, and the research lens's files go one at a time because `lenses/` is
      # a working directory - its outbox, its dated reports, its notes to itself - and none
      # of that belongs on the site. `X-16`.
      #
      # The link is the repository's own path in both cases, so the same href works in a
      # clone and here, and there is no second copy of anything to go stale.
      #
      # `tests/browsable.rs` reads this file and fails if a linked path is not named in it.
      # That check can see the name and not the copy, so every copy asserts its own result
      # below - `cp` of a moved file is loud, but a `cp -r` of a moved directory is not.
      # **The reports as committed, which is a change the sweep moving out made.** They used
      # to be whatever the sweep had just rewritten in this job, because it ran a few steps
      # above; now it runs elsewhere and these are the copies the last local run committed.
      #
      # **That is the right version to publish and worth saying out loud**: `reports/` is
      # generated but committed deliberately, a person reads it and decides from it, and the
      # sweep's own job keeps its fresh copies as an artifact for comparison.
      # **Runs whether or not the build did** - `X-43`. Everything it copies is committed, so it
      # needs no toolchain and no bundle; `mkdir -p` is what lets it work when `trunk` never ran.
      # **Without this, a `cargo fmt` failure published a site with no reports.**
      - name: Copy the reports into the artifact
        if: always()
        run: |
          mkdir -p crates/game4x/dist
          cp -r reports crates/game4x/dist/reports
          cp -r scenario crates/game4x/dist/scenario
          mkdir -p crates/game4x/dist/spec
          cp -r spec/data crates/game4x/dist/spec/data
          # **The four the hand list did not have** - `S-230`, found by Sean clicking the
          # first outward link he came to. 574 of the reports' 584 outward links 404ed on
          # the published site and 10 worked, and the two the comment above names are two
          # of the ten. **The hazard was understood and the enumeration was by hand**, which
          # is the shape this file has now met four times.
          cp -r regression crates/game4x/dist/regression
          cp -r reviewed crates/game4x/dist/reviewed
          cp -r spec/tests crates/game4x/dist/spec/tests
          mkdir -p crates/game4x/dist/crates/game-model
          cp -r crates/game-model/data crates/game4x/dist/crates/game-model/data
          mkdir -p crates/game4x/dist/lenses/research crates/game4x/dist/tools/research/formulas
          cp lenses/research/formulas.html crates/game4x/dist/lenses/research/formulas.html
          cp tools/research/formulas/data.json crates/game4x/dist/tools/research/formulas/data.json
          cp tools/research/formulas/results.json crates/game4x/dist/tools/research/formulas/results.json
          # **A `.txt` twin beside every input, because the site serves a `.4x` as a
          # download.** Measured: `spec/data/kinds.4x` answers 200 with
          # `application/octet-stream`. Pages picks the type from the extension, does not know
          # this one, and offers no way to override it - no `.htaccess`, no `_headers`.
          #
          # **Nothing `.txt` is committed.** Sean scoped this to the published site: *I don't
          # necessarily need it to be rendered when I browse it as source*. So the twin is made
          # here and `reports/index.html` links it, which is why a clone's copy of that page
          # has links that resolve only once deployed - `S-134`, and `R-11` permits a
          # non-canonical generated copy so long as the page says it is one.
          find crates/game4x/dist/spec/data crates/game4x/dist/scenario -name '*.4x' \
            -exec sh -c 'cp "$1" "$1.txt"' _ {} \;
          # **`reports/index.html` is gone with the old ruleset's reports** - `D-4`, and
          # `S-207` measured the directory at forty because `ls` counts `foundation` as one
          # entry. It is thirty-nine files of the old run and fifty-four of the engine's, and
          # only the first thirty-nine went. **So this asserts what is left rather than what
          # was**: the foundation forms `R-12` serves.
          test -d crates/game4x/dist/reports/foundation
          test "$(find crates/game4x/dist/reports/foundation -name '*.4x' | wc -l)" -ge 40
          # **`scenario/main.4x` rather than `scenario/expected/play.4x`.** `D-4` deleted the
          # old ruleset's playthrough and the expectation beside it; the scenario is one file
          # now and it is the one the reports link.
          test -f crates/game4x/dist/scenario/main.4x
          # **`schema.4x` rather than `kinds.4x`, which stopped existing before today.**
          # `spec/data/` is the engine's friendly source now and holds two files. This line
          # named a third and **the deploy job is the only thing that reads it**, so it would
          # have failed an hour into a run rather than on a push - found by re-deriving what
          # the step copies, not by anything going red.
          test -f crates/game4x/dist/spec/data/schema.4x
          # **Every twin, counted against every input**, so a copy that silently made none
          # fails here rather than on the site. Nineteen today: eleven in `spec/data` and eight
          # in `scenario`.
          #
          # **A floor rather than that number, and the reason is that the number broke the
          # build.** It said twenty, `P-557` deleted `spec/data/above.4x`, and this step failed
          # fifty-six minutes into a run - **the only hard-coded count in the step, and the only
          # thing in it that broke.** Its two neighbours derive what they compare against and
          # neither noticed.
          #
          # **And the floor broke it a second time, for the same reason.** It said fifteen; `D-6`
          # moved `scenario/regression/` out of `scenario/` to sit beside `reviewed/`, and the two
          # directories this counts went from 46 `.4x` files to 11. **A floor is still a literal
          # about a population**, so replacing a count with a smaller count bought one move's
          # grace rather than a different kind of check.
          #
          # **The neighbours that derive what they compare against have still never broken**,
          # which is the whole lesson: so the copy is compared against the source it was made
          # from, and the only number left is a floor on the source being there at all.
          #
          # **The sentence about `browsable.rs` is gone with the file.** It said the exact count
          # was asserted where the local gate could see it; `D-4` deleted that test with the
          # reports it was about, so the claim had stopped being true as well.
          source=$(find spec/data scenario -name '*.4x' | wc -l)
          inputs=$(find crates/game4x/dist/spec/data crates/game4x/dist/scenario -name '*.4x' | wc -l)
          twins=$(find crates/game4x/dist/spec/data crates/game4x/dist/scenario -name '*.4x.txt' | wc -l)
          test "$source" -ge 5
          test "$inputs" -eq "$source"
          test "$twins" -eq "$inputs"
          test -f crates/game4x/dist/lenses/research/formulas.html
          test -f crates/game4x/dist/tools/research/formulas/data.json
          test -f crates/game4x/dist/tools/research/formulas/results.json
          # **The engine's tests, served where they are asked for.** Sean, 2026-09-21:
          # *can I render the tests from somewhere under
          # https://seanshubin.github.io/game4x/reports/*. They land at
          # `/game4x/reports/review/`, and the data beside the page so that every link in
          # it is relative and resolves at any subpath - the same property the other reports
          # already turn on.
          #
          # **The twins are `S-134` again and not a second decision.** A `.4x` is served as a
          # download here and as text by `review-web`, so the page links `.4x.txt` when it is a
          # file and `/data/...4x` when something is serving - and says which, because a clone's
          # copy has links that resolve only once deployed.
          #
          # **The page is copied as committed**, so it is as fresh as the last
          # `cargo run --example report`. Nothing compares it against a generator, which is why
          # this says so rather than asserting it.
          #
          # **Two roots since `P-532`, because the tests moved out of the prototype.** The page
          # links `spec/tests/<name>.4x.txt` for the form Sean reads and `data/foundation/...`
          # for the form the engine runs, and both are relative to this directory - so both roots
          # are copied under it. **Copying only `data/` published a page whose every *on disk*
          # link was dead**, which is what this step looked like between the move and now.
          #
          # **It was published at `thin-engine` until 2026-10-02, and the reason given for
          # keeping that name was false.** The comment here said it was *a URL Sean asked for
          # and has, so renaming it would break a link he holds* - and on 2026-10-02 he went
          # looking for this page, could not find it, and `S-249` found why: **nothing in the
          # tree linked it**, `reports/index.md` listed twelve pages and not this one, and the
          # last thing still carrying that name was the address of a crate that stopped
          # existing on 2026-09-25.
          #
          # **So the link he held did not exist**, and the trade the comment described was
          # tidiness against nothing. Sean, asked where it should be: *reports review is good*,
          # and *it should be reachable from the root reports page.*
          #
          # **The old path does not keep answering**, which is this lane's call and he left it
          # here. Nothing links it, he holds no working link to lose - that is what `S-249`
          # established - and two addresses for one page, one named after a crate that is gone,
          # is how a wrong name survives a rename. **A stale URL that still works is what
          # stopped anyone noticing this one.**
          mkdir -p crates/game4x/dist/reports/review/spec
          # **Already there from `cp -r reports` above**, since `S-249` moved the generator's
          # output under `reports/`. Kept as an assertion rather than a copy: if it is missing,
          # the page nobody can find is the page nobody published.
          test -f crates/game4x/dist/reports/review/index.html
          cp -r crates/game-model/data crates/game4x/dist/reports/review/data
          cp -r spec/tests crates/game4x/dist/reports/review/spec/tests
          find crates/game4x/dist/reports/review -name '*.4x' \
            -exec sh -c 'cp "$1" "$1.txt"' _ {} \;
          # **Every twin against every input**, so a copy that made none fails here rather than
          # on the site - the same count the twenty above are held by.
          review=$(find crates/game4x/dist/reports/review -name '*.4x' | wc -l)
          review_twins=$(find crates/game4x/dist/reports/review -name '*.4x.txt' | wc -l)
          test "$review" -gt 100
          test "$review_twins" -eq "$review"
          # **The tests counted against the repository rather than against a number**, so a root
          # that failed to copy fails here even if the other one grew enough to cover it. The
          # total above could not tell those apart: it was `-gt 100` while `data/` alone was 118,
          # and the move took it to 64 without anyone editing this file.
          published=$(find crates/game4x/dist/reports/review/spec/tests -name '*.4x' | wc -l)
          test "$published" -eq "$(find spec/tests -name '*.4x' | wc -l)"
          test "$published" -gt 40
          test -f crates/game4x/dist/reports/review/index.html
          # **And a twin for every `.4x` anywhere under the artifact, because naming the roots
          # is what went wrong.** The two passes above each name a pair of directories, and
          # `R-12` added `reports/foundation/` - 54 generated files - which neither covers. They
          # would have published as downloads with nothing saying so.
          #
          # **Coverage by default**, which is the argument this file already makes twice: the
          # crate list is *selected by exclusion* and the tools are *found rather than listed*,
          # both after a name list went stale. A root that is forgotten is now twinned anyway,
          # and the assertion below is over the whole tree rather than over a directory somebody
          # remembered.
          find crates/game4x/dist -name '*.4x' -exec sh -c 'test -f "$1.txt" || cp "$1" "$1.txt"' _ {} \;
          all_inputs=$(find crates/game4x/dist -name '*.4x' | wc -l)
          all_twins=$(find crates/game4x/dist -name '*.4x.txt' | wc -l)
          test "$all_inputs" -gt 150
          test "$all_twins" -eq "$all_inputs"
          # **Every outward link a report makes, resolved against the artifact** - `S-230`.
          # The copies above are a list and a list goes stale; this asks the question the
          # list is an answer to, over every link rather than every directory.
          #
          # **Derived from the reports rather than from anything anyone remembered.** The
          # population is whatever `../` paths the reports actually contain, so a report that
          # starts linking somewhere new fails here on the run that publishes it, instead of
          # on the page.
          #
          # **A link's fragment is not part of its path**, which is why the pattern stops at
          # the characters a path may hold - `../spec/logistics.md#shape` is a link to the
          # file.
          outward=$(grep -oh '\.\./[a-zA-Z0-9_./-]*' reports/*.md reports/*.html \
            | sed 's|^\.\./||' | sort -u)
          dead=0
          reached=0
          for link in $outward; do
            reached=$((reached + 1))
            if [ ! -e "crates/game4x/dist/$link" ]; then
              echo "  404 on the published site: ../$link"
              dead=$((dead + 1))
            fi
          done
          # **Both populations, because zero dead over zero links is the same green.** The
          # floor is on the scan finding links at all; the equality is the finding itself.
          test "$reached" -gt 100
          test "$dead" -eq 0
          echo "Resolved $reached distinct outward link(s) from the reports, none dead"
          echo "Published $review review-app inputs with $review_twins twins, $published of them tests"
          echo "Published $all_inputs .4x files with $all_twins twins, over the whole artifact"
          echo "Published $(find crates/game4x/dist/reports -type f | wc -l) report files"

      # **What this run made of the tree, written where the reports index already links it** -
      # `P-613`: *what broke is reachable from the report root. I find out by navigating from the
      # reports index rather than by reading a run's log, so a run that fails leaves a page saying
      # what failed, linked from there.*
      #
      # **The step's name and its conclusion, which is the choice `S-252` left open.** His words ask
      # for the name and do not forbid the output; the name plus a link is what makes the page
      # answer *what broke* without reproducing a log that would be stale the moment it is read.
      # **The link is to the run, not instead of the page** - he said he finds out by navigating.
      #
      # **Only this job's steps, because `checks` and `sweep` run in parallel** and their results do
      # not exist yet. Waiting for them would delay the page, which is the thing `P-612` forbids.
      # The page says so rather than implying it covered them.
      - name: Say what this run did
        if: always()
        run: |
          mkdir -p crates/game4x/dist/reports
          # **The gate's result, not this job's** - `job.status` here is `deploy`'s, which is
          # always running at this point and would have said `success` while the build was red.
          # **A page reporting the status of the job that wrote it says nothing**, which is the
          # shape `X-43` was: a sentence true of something adjacent to its subject.
          outcome="${{ needs.gate.result }}"
          cat > crates/game4x/dist/reports/run.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>This run</title>
          <link rel="stylesheet" href="report.css">
          </head>
          <body>
          <h1>This run</h1>
          <p class="tally">The build job <strong>$outcome</strong>.</p>
          <p class="note">Commit <code>${{ github.sha }}</code>. The test suites and the mutation
          sweep run in their own jobs, in parallel with this one, so their results are not known
          here - <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">this run</a>
          has all of them.</p>
          <p class="note">The whole site publishes whether or not the run succeeded, so a broken
          game is published rather than nothing. If something here is wrong, this is where the
          build said so.</p>
          <p><a href="index.html">The index</a></p>
          </body>
          </html>
          HTML
          {
            echo "# This run"
            echo
            echo "The build job **$outcome**."
            echo
            echo "Commit \`${{ github.sha }}\`. The test suites and the mutation sweep run in their own jobs, in parallel with this one, so their results are not known here."
            echo
            echo "[The index](index.md)"
          } > crates/game4x/dist/reports/run.md

      # **Uploaded whether or not anything above succeeded** - `P-613`: *the whole site publishes
      # whether or not the run succeeded. A failing build leaves a broken game published rather
      # than nothing published, because deploying is how I verify and a staging area that vanishes
      # when it breaks is no use to me.*
      #
      # **`mkdir -p` above is what makes that work**: a build that failed leaves no `dist/`, and an
      # upload of a missing directory fails rather than publishing the committed half.
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: crates/game4x/dist

      # **`always()`, and the check is what said so.** Without it a failure in any step above -
      # carrying the bundle, copying the reports - skips the publish, which is `X-43` in the new
      # shape: the deploy succeeds at doing nothing, or does not run, and the site is whatever was
      # there before. **`every_step_that_assembles_or_publishes_survives_a_failure` named this
      # step** the moment the assembly moved here.
      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v5

  # -- Verify (notify-only) ---------------------------------------------------
  # The remaining work, run AFTER deploy so the page ships as fast as the gate allows.
  # `always() && gate succeeded` lets these run even when `deploy` is skipped (pull
  # requests); a failure here does not undo the deploy, it only reds the run.
  full-tests:
    name: Verify - full test suite
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: full-tests

      - name: Test (whole workspace)
        run: cargo test --release --workspace

  native-build:
    name: Verify - native build (${{ matrix.os }})
    needs: [gate, deploy]
    if: always() && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Bevy Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update \
            || echo "apt-get update failed; the install below is what decides this step"
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: native

      - name: Build the application and the prototype
        run: cargo build --release -p game4x -p planet-view
