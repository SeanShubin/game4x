<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>game4x</title>

    <!--
      Build provenance. CI rewrites these placeholders in the built dist/index.html
      (see the "build provenance" step in pipeline.yml); a local `trunk build` leaves
      them alone, which the diagnostics below report as "(local dev)". A matching
      /game4x/build-info.json is written next to this file.
    -->
    <meta name="build-commit" content="__BUILD_COMMIT__" />
    <meta name="build-time" content="__BUILD_TIME__" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0e12;
        overflow: hidden;
        /* Stop iOS pull-to-refresh and rubber-band scroll from eating drags meant
           for the globe. */
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        /* Deliver raw touch drags to the app instead of letting the browser pan and
           zoom the page - without this, turning the world by touch never reaches
           Bevy. `user-select` likewise stops a drag becoming a text selection. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* --------------------------------------------------------------------
         The console and the data browser.

         These are elements on the page rather than glyphs drawn by the engine,
         and that is the whole point: a text field, a scroll region and a button
         already do the clipboard, the iOS soft keyboard, text selection and
         touch, all of which a canvas cannot be made to do. See
         crates/game-front/README.md.
         -------------------------------------------------------------------- */
      :root {
        --ink: #e6e9ef;
        --dim: #7b8698;
        --panel: #0b0d11;
        --edge: #1c2230;
        --accent: #6f9be0;
      }

      /* Always on top of every surface, so no surface can trap the player. */
      #surfaces {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        padding: max(8px, env(safe-area-inset-top)) 10px 8px 0;
        z-index: 20;
        /* The bar is not a target; only the buttons in it are, so a drag that
           misses a button still reaches the globe underneath. */
        pointer-events: none;
      }
      #surfaces button {
        pointer-events: auto;
        font: 13px/1 ui-monospace, monospace;
        color: var(--dim);
        background: rgba(12, 14, 18, 0.72);
        border: 1px solid var(--edge);
        border-radius: 6px;
        /* Sized for a fingertip rather than for the words in it. As Text nodes
           on the canvas these were 13px tall and had no picking backend behind
           them, so a tap reached nothing at all. */
        padding: 11px 14px;
        margin-left: 8px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        /* Without this iOS waits 300ms for a possible double tap. */
        touch-action: manipulation;
      }
      #surfaces button[aria-current="true"] {
        color: var(--ink);
        border-color: var(--accent);
      }

      /* The controls for starting a new game, on the game surface only.
         releases/first-release.md binds choosing a planet size to a control for each
         size; spec/interface.md is why there has to be one at all, since a key is a
         thing a tablet does not have. */
      #sizes {
        position: fixed;
        left: 0;
        bottom: 0;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 10px 12px max(10px, env(safe-area-inset-bottom));
        z-index: 20;
        font: 12px/1 ui-monospace, monospace;
        color: var(--dim);
      }
      #sizes[data-showing="true"] {
        display: flex;
      }
      #sizes button {
        font: inherit;
        color: var(--ink);
        background: rgba(12, 14, 18, 0.72);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 10px 11px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #sizes button:hover {
        border-color: var(--accent);
      }

      .surface {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        background: var(--panel);
        color: var(--ink);
        font: 13px/1.5 ui-monospace, monospace;
        padding: calc(max(8px, env(safe-area-inset-top)) + 46px) 14px
          max(14px, env(safe-area-inset-bottom));
      }
      .surface[data-showing="true"] {
        display: flex;
      }
      .surface pre {
        flex: 1 1 auto;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-overflow-scrolling: touch;
        /* The canvas rule above turns selection off. Here it is the point. */
        user-select: text;
        -webkit-user-select: text;
      }
      #prompt-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--edge);
      }
      #prompt-row span {
        color: var(--accent);
      }
      #prompt {
        flex: 1 1 auto;
        min-width: 0;
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 0;
        outline: none;
        padding: 8px 0;
      }

      /* The wasm bundle is tens of megabytes, and until it has arrived and compiled
         there is nothing on the page at all. Without this the tab is simply black for
         however long that takes, which is indistinguishable from a broken site. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #0c0e12;
        color: #e6e9ef;
        font: 14px/1.6 ui-monospace, monospace;
        z-index: 50;
        transition: opacity 0.35s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .title {
        font-size: 20px;
        letter-spacing: 0.14em;
        color: #9fb4d8;
      }
      #loading .bar {
        width: min(320px, 60vw);
        height: 3px;
        background: #1c2028;
        overflow: hidden;
      }
      #loading .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: #6f9be0;
        transition: width 0.2s linear;
      }
      /* Used when the download size cannot be trusted - see the progress code below. */
      #loading .bar.unknown > i {
        width: 35%;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      #loading .detail {
        color: #7b8698;
        font-size: 12px;
      }

      /* Hidden until a startup error surfaces, then it paints the message over the
         otherwise black canvas. */
      #diag-overlay {
        position: fixed;
        inset: 0;
        margin: 0;
        padding: 1rem;
        z-index: 9999;
        background: #0c0e12;
        color: #f77;
        font: 12px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
        overflow: auto;
      }
    </style>

    <!--
      Diagnostics, registered before the wasm module so that a failed boot is not a
      silent black screen. Rust panics cross the JS boundary as errors or rejected
      promises, so both are caught and painted onto the page, tagged with the build
      commit and with which GPU backends this browser actually exposes - the fact that
      separates "this browser cannot run it" from "the build is broken".
    -->
    <script>
      (function () {
        function meta(name) {
          var el = document.querySelector('meta[name="' + name + '"]');
          return el ? el.content : "(unknown)";
        }
        function real(value) {
          return value.indexOf("__BUILD") === 0 ? "(local dev)" : value;
        }
        var build = { commit: real(meta("build-commit")), time: real(meta("build-time")) };
        window.__BUILD__ = build;
        console.info("game4x build:", build.commit, "-", build.time);

        var gpu = {
          webgl2: !!document.createElement("canvas").getContext("webgl2"),
          webgpu: !!navigator.gpu,
        };
        window.__GPU__ = gpu;
        console.info("gpu backends:", gpu);

        function show(title, detail) {
          var pre = document.getElementById("diag-overlay");
          if (!pre) {
            pre = document.createElement("pre");
            pre.id = "diag-overlay";
            (document.body || document.documentElement).appendChild(pre);
          }
          pre.textContent =
            "game4x " + build.commit + " - built " + build.time + "\n" +
            "gpu: webgl2=" + gpu.webgl2 + " webgpu=" + gpu.webgpu + "\n\n" +
            title + "\n" + (detail || "");
        }
        window.__DIAG__ = show;

        window.addEventListener("error", function (e) {
          show("Error:", (e.message || "") + "\n" + ((e.error && e.error.stack) || ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason;
          show("Unhandled promise rejection:", (reason && (reason.stack || reason.message)) || String(reason));
        });
      })();
    </script>

    <!--
      Download progress.

      wasm-bindgen fetches the module itself, so the only way to observe it is to wrap
      `fetch` before that happens: the response body is re-emitted through a stream that
      counts bytes on the way past, and a fresh Response carrying the original headers is
      handed back so `instantiateStreaming` still sees `application/wasm`.

      Every step is guarded. If anything at all goes wrong the original response is
      returned untouched, because a missing progress bar is a far smaller problem than a
      page that will not start.
    -->
    <script>
      (function () {
        var el = {};
        function ui() {
          if (!el.root) {
            el.root = document.getElementById("loading");
            if (el.root) {
              el.bar = el.root.querySelector(".bar");
              el.fill = el.root.querySelector(".bar > i");
              el.detail = el.root.querySelector(".detail");
            }
          }
          return el.root;
        }
        function mb(bytes) {
          return (bytes / 1048576).toFixed(1) + " MB";
        }
        function report(seen, total) {
          if (!ui()) return;
          // `content-length` is the *compressed* length when the server encodes the
          // response, while the stream yields decompressed bytes - so the two disagree
          // and the percentage would sail past 100. Only trust it while it holds up.
          if (total > 0 && seen <= total) {
            el.bar.classList.remove("unknown");
            el.fill.style.width = ((seen / total) * 100).toFixed(1) + "%";
            el.detail.textContent = "downloading " + mb(seen) + " of " + mb(total);
          } else {
            el.bar.classList.add("unknown");
            el.detail.textContent = "downloading " + mb(seen);
          }
        }
        function starting() {
          if (!ui()) return;
          el.bar.classList.add("unknown");
          el.detail.textContent = "compiling and starting";
        }

        var nativeFetch = window.fetch && window.fetch.bind(window);
        if (nativeFetch && window.ReadableStream) {
          window.fetch = function (input, init) {
            var url = typeof input === "string" ? input : (input && input.url) || "";
            var pending = nativeFetch(input, init);
            if (!/\.wasm(\?|#|$)/.test(url)) return pending;
            return pending.then(function (response) {
              try {
                if (!response.ok || !response.body) return response;
                var total = Number(response.headers.get("content-length")) || 0;
                var seen = 0;
                var reader = response.body.getReader();
                var counted = new ReadableStream({
                  pull: function (controller) {
                    return reader.read().then(function (chunk) {
                      if (chunk.done) {
                        starting();
                        controller.close();
                        return;
                      }
                      seen += chunk.value.byteLength;
                      report(seen, total);
                      controller.enqueue(chunk.value);
                    });
                  },
                  cancel: function (reason) {
                    return reader.cancel(reason);
                  },
                });
                return new Response(counted, {
                  headers: response.headers,
                  status: response.status,
                  statusText: response.statusText,
                });
              } catch (whatever) {
                return response;
              }
            });
          };
        }

        // Bevy creates its canvas once the module is running, which is the first moment
        // there is anything to look at. Poll for it rather than guess a duration.
        var waiting = setInterval(function () {
          var canvas = document.querySelector("canvas");
          if (canvas && canvas.width > 0) {
            clearInterval(waiting);
            var root = ui();
            if (root) {
              root.classList.add("done");
              setTimeout(function () {
                if (root.parentNode) root.parentNode.removeChild(root);
              }, 400);
            }
          }
        }, 120);
      })();
    </script>

    <!--
      Trunk entry point. It sits next to this crate's Cargo.toml so Trunk resolves
      `game4x` as the target package - the workspace root is a virtual manifest with no
      root package of its own. CI passes `--public-url /game4x/` so that asset URLs
      resolve under the GitHub Pages project subpath.
    -->
    <link data-trunk rel="rust" data-bin="game4x" data-wasm-opt="z" />
  </head>
  <body>
    <div id="loading">
      <div class="title">game4x</div>
      <div class="bar unknown"><i></i></div>
      <div class="detail">loading</div>
    </div>

    <!--
      The three surfaces spec/interface.md asks for. Which one is in front is a
      fact about the front end rather than about the game, so nothing here goes
      near the model: every one of these reads or runs through the one Session,
      by way of the wasm exports in game-front's web shell.
    -->
    <nav id="surfaces" aria-label="surfaces">
      <button type="button" data-surface="game" aria-current="true">F1 game</button>
      <button type="button" data-surface="console">F2 console</button>
      <button type="button" data-surface="browser">F3 browser</button>
    </nav>

    <!--
      Starting over. Each button types `/new <size>` at the one console, so a tap and a
      typed line are the same act arriving by different routes - the control is a line
      wearing a button rather than a second way to change anything.
    -->
    <nav id="sizes" data-showing="true" aria-label="view and new game">
      <button type="button" id="reset">reset view</button>
      <span aria-hidden="true">new game</span>
      <button type="button" data-size="tiny">tiny</button>
      <button type="button" data-size="small">small</button>
      <button type="button" data-size="medium">medium</button>
      <button type="button" data-size="large">large</button>
      <button type="button" data-size="huge">huge</button>
    </nav>

    <section class="surface" id="surface-console" data-showing="false" aria-label="console">
      <pre id="transcript" tabindex="0">starting</pre>
      <!--
        A real form and a real text field. `autocapitalize` and `autocorrect` are
        off because iOS would otherwise send `Show Territory 5`, and the command
        language is case sensitive; `enterkeyhint` puts "go" on the soft keyboard
        rather than a newline it has nowhere to put.
      -->
      <form id="prompt-row" autocomplete="off">
        <span aria-hidden="true">&gt;</span>
        <input
          id="prompt"
          type="text"
          name="command"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="go"
          inputmode="text"
          aria-label="type a command"
        />
      </form>
    </section>

    <section class="surface" id="surface-browser" data-showing="false" aria-label="data browser">
      <pre id="entities" tabindex="0">starting</pre>
    </section>

    <script>
      (function () {
        var showing = "game";
        var bindings = null;

        function el(id) {
          return document.getElementById(id);
        }
        function toBottom(node) {
          node.scrollTop = node.scrollHeight;
        }

        // Every read goes through the wasm exports, which go through the one
        // Session. The page holds no copy of anything.
        function paint() {
          if (!bindings) return;
          if (showing === "console") el("transcript").textContent = bindings.console_transcript();
          if (showing === "browser") el("entities").textContent = bindings.browser_text();
        }

        function show(name) {
          showing = name;
          var buttons = document.querySelectorAll("#surfaces button");
          for (var i = 0; i < buttons.length; i++) {
            buttons[i].setAttribute("aria-current", String(buttons[i].dataset.surface === name));
          }
          el("surface-console").dataset.showing = String(name === "console");
          el("surface-browser").dataset.showing = String(name === "browser");
          // Only over the game: there is nothing to look at behind the other two.
          el("sizes").dataset.showing = String(name === "game");
          paint();
          if (name === "console") {
            toBottom(el("transcript"));
            // Focused inside the tap that asked for the console, because that is
            // the only moment iOS will raise the soft keyboard. Done a tick later
            // it is refused, and the field cannot be typed at on a tablet.
            el("prompt").focus();
          } else {
            el("prompt").blur();
            // And the game gets the keyboard back. winit listens for keys on the
            // canvas and gives it tabindex="0", so once the prompt has taken focus
            // the arrows, R and the size keys are dead until something hands it
            // back - blurring alone leaves focus on <body>, which reaches nothing.
            var canvas = document.querySelector("canvas");
            if (name === "game" && canvas) canvas.focus();
          }
        }

        var buttons = document.querySelectorAll("#surfaces button");
        for (var i = 0; i < buttons.length; i++) {
          (function (button) {
            button.addEventListener("click", function () {
              show(button.dataset.surface);
            });
          })(buttons[i]);
        }

        // spec/planet.md asks that the view can be put back, and spec/interface.md
        // that doing so never needs a key the platform may lack. R is such a key.
        el("reset").addEventListener("click", function () {
          if (bindings) bindings.request_view_reset();
        });

        var sizes = document.querySelectorAll("#sizes button[data-size]");
        for (var n = 0; n < sizes.length; n++) {
          (function (button) {
            button.addEventListener("click", function () {
              if (!bindings) return;
              // The same line a person would type, and the same line the number keys
              // type. The globe notices on its own, by watching the counter.
              bindings.console_submit("/new " + button.dataset.size);
              paint();
            });
          })(sizes[n]);
        }

        el("prompt-row").addEventListener("submit", function (event) {
          event.preventDefault();
          var line = el("prompt").value;
          el("prompt").value = "";
          if (!bindings) return;
          // What comes back is the whole transcript. The page never decides how a
          // line was rendered, or how many lines one command said.
          el("transcript").textContent = bindings.console_submit(line);
          toBottom(el("transcript"));
          // spec/console.md: a line beginning with `/` is not a command, it names a
          // surface to go to. That rule is about a line typed at the console, not about
          // a terminal, so typing `/browser` here has to work exactly as tapping the
          // button does. Empty means the line named no surface.
          var reached = bindings.console_reached();
          if (reached) show(reached);
        });

        // winit listens for keys on the canvas, so a focused text field already
        // keeps them to itself. Said out loud anyway: without it, typing `run
        // setup` at the console would also be pressing the globe's own keys.
        ["keydown", "keyup", "keypress"].forEach(function (kind) {
          el("prompt").addEventListener(kind, function (event) {
            event.stopPropagation();
          });
        });

        // The same three surfaces from a keyboard. releases/first-release.md ->
        // Controls names all three routes: the three surfaces are reached by F1,
        // F2 and F3, by buttons on the page, and by /game, /console and /browser
        // typed at the console. These are the first of those three.
        document.addEventListener("keydown", function (event) {
          var at = ["F1", "F2", "F3"].indexOf(event.key);
          if (at < 0) return;
          event.preventDefault();
          show(["game", "console", "browser"][at]);
        });

        function started() {
          bindings = window.wasmBindings;
          if (!bindings || !bindings.console_transcript) {
            el("transcript").textContent =
              "the console did not load. See the page's diagnostics above.";
            return;
          }
          paint();
        }
        // This script is parsed before the module Trunk defers into the head, so
        // the listener is always in place first. The check is for the case where
        // that ever stops being true.
        addEventListener("TrunkApplicationStarted", started);
        if (window.wasmBindings) started();
      })();
    </script>
  </body>
</html>
