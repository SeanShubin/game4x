[package]
name = "planet-bevy"
version.workspace = true
edition.workspace = true
description = "Bevy adapter for the planet view: window, input, and vsync presentation. The only crate that knows an engine exists."

[dependencies]
planet-render.workspace = true
planet-presentation.workspace = true
planet-model.workspace = true
planet-terrain.workspace = true
sphere-tessellation.workspace = true
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui"] }
