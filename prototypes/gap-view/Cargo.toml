# **A workspace member since 2026-09-12**, which is what `C-76` was waiting for.
#
# It stayed out deliberately and temporarily: `tools/outbox/tests/architecture.rs` requires
# every workspace member to have a row in `docs/architecture.md`, `docs/` is the specification
# lane's column, and adding the member before the row existed would have reddened the gate for
# everybody - including a deploy - over a file this lane may not write.
#
# **Both rows landed**, in `docs/architecture.md` and in the table in
# `docs/prototypes/README.md`, so the member line went in the moment they did and the
# standalone `[workspace]` came out. The sequencing cost nothing, which is what `C-76` said it
# would.

[package]
