# Workspace root. This manifest defines no package of its own; the composition root,
# the game logic, the renderer, and each prototype are separate member crates.
# See docs/architecture.md.

[workspace]
resolver = "3"
members = [
    "crates/sphere-tessellation",
    "crates/graph-coloring",
    "crates/planet-model",
    "crates/planet-ecs",
    "crates/planet-render",
    "crates/planet-bevy",
    "crates/game4x",
    "prototypes/planet-view",
]
# Documentation tooling, deliberately outside the workspace so it never appears in
# `cargo tree` or `cargo build --workspace`.
exclude = ["tools/pad-tables"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sphere-tessellation = { path = "crates/sphere-tessellation" }
graph-coloring = { path = "crates/graph-coloring" }
planet-model = { path = "crates/planet-model" }
planet-ecs = { path = "crates/planet-ecs" }
planet-render = { path = "crates/planet-render" }
planet-bevy = { path = "crates/planet-bevy" }
game4x = { path = "crates/game4x" }

[profile.dev]
# The planet view rasterizes per pixel; an unoptimized build is unusably slow.
opt-level = 2
