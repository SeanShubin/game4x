# Workspace root. This manifest defines no package of its own; the composition root,
# the game logic, the renderer, and each prototype are separate member crates.
# See docs/architecture.md.

[workspace]
resolver = "3"
members = [
    "crates/command-language",
    "crates/game-model",
    "crates/game-console",
    "crates/game-front",
    "crates/game-globe",
    "crates/sphere-tessellation",
    "crates/graph-coloring",
    "crates/planet-model",
    "crates/planet-terrain",
    "crates/planet-ecs",
    "crates/planet-render",
    "crates/planet-raster",
    "crates/planet-presentation",
    "crates/planet-bevy",
    "crates/planet-flat",
    "crates/game4x",
    "prototypes/planet-view",
    "prototypes/goldberg-view",
]
# Documentation tooling, deliberately outside the workspace so it never appears in
# `cargo tree` or `cargo build --workspace`.
exclude = ["tools/pad-tables", "tools/outbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
command-language = { path = "crates/command-language" }
game-model = { path = "crates/game-model" }
game-console = { path = "crates/game-console" }
game-front = { path = "crates/game-front" }
game-globe = { path = "crates/game-globe" }
sphere-tessellation = { path = "crates/sphere-tessellation" }
graph-coloring = { path = "crates/graph-coloring" }
planet-model = { path = "crates/planet-model" }
planet-terrain = { path = "crates/planet-terrain" }
planet-ecs = { path = "crates/planet-ecs" }
planet-render = { path = "crates/planet-render" }
planet-raster = { path = "crates/planet-raster" }
planet-presentation = { path = "crates/planet-presentation" }
planet-bevy = { path = "crates/planet-bevy" }
planet-flat = { path = "crates/planet-flat" }
game4x = { path = "crates/game4x" }

[profile.dev]
# The planet view rasterizes per pixel; an unoptimized build is unusably slow.
opt-level = 2

# What the published bundle is built with, and nothing else. Size is a user-visible cost
# on the web in a way it never is natively - it is time spent staring at a loading bar -
# so this trades compile time and a little speed for a smaller download.
#
# Kept separate from `release` on purpose: `cargo run --release` is the inner loop for the
# native views, and link-time optimization would make that noticeably slower to no benefit.
#
# `panic = "abort"` is free here rather than a decision. Unwinding does not exist on
# wasm32-unknown-unknown, so all it removes is the landing-pad tables that go with it.
# Thin LTO rather than fat: a GitHub runner has limited memory, and fat LTO over Bevy is
# where that runs out.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"

# Deliberately no `strip`. It removes custom sections, and one of those is
# `target_features`, which is how wasm-opt learns the module is allowed to use bulk
# memory - without it, wasm-opt validates against the MVP feature set and rejects its own
# input with "Bulk memory operations require bulk memory". Nothing is lost by leaving it
# off either way: wasm-opt already drops the debug and name sections, so the built module
# carries only `producers` and `target_features`, a couple of hundred bytes between them.
