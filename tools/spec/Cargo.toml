# The specification lane's editing tool. Not a member of the game's workspace: it edits the
# repository rather than shipping in it, so it stays out of `cargo tree` and
# `cargo build --workspace`, like `tools/pad-tables` and `tools/outbox`.
#
# All three are kept out by the root manifest's `exclude` list. This one declared an empty
# `[workspace]` of its own until the code lane added it there, which is the tidier of the two
# and was theirs to write.
[package]
name = "spec"
version = "0.1.0"
edition = "2024"


[lib]
name = "spec"
path = "src/lib.rs"

[dependencies]
