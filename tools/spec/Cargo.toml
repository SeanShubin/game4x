# Not a workspace member. This is the specification lane's editing tool, not part of the game, so
# it stays out of `cargo build --workspace` and out of `cargo tree`. Sibling of `tools/outbox` and
# `tools/pad-tables`, and excluded in the workspace root manifest for the same reason.
[package]
name = "spec"
version = "0.1.0"
edition = "2024"

[lib]
name = "spec"
path = "src/lib.rs"

[dependencies]
