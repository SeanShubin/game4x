<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The game's data, edited by choosing</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>

<header>
  <h1>The game's data, edited by choosing</h1>
  <p class="sub">
    A prototype. Every value is a selection; the only thing typed is a thing's name, once,
    when it is created. Generated from <code>releases/first-release.md</code> &mdash; edits
    live in this page and are exported, never written back.
  </p>
  <div class="actions">
    <button id="export">Export JSON</button>
    <button id="revert" class="quiet">Revert to the release</button>
    <span id="dirty" class="dirty" hidden>edited</span>
  </div>
</header>

<div class="shell">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script src="game.js"></script>
<script src="editor.js"></script>
</body>
</html>
