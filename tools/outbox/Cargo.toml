# Not a workspace member. This is a workflow tool, not part of the game, so it stays out of
# `cargo build --workspace` and out of `cargo tree`. Sibling of `tools/pad-tables`, and its own
# workspace root for the same reason - see the note there.

[workspace]

[package]
name = "outbox"
version = "0.1.0"
edition = "2024"

[lib]
name = "outbox"
path = "src/lib.rs"

[[bin]]
name = "outbox"
path = "src/main.rs"

[dependencies]
